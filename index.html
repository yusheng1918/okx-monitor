<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧易博主实盘监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 10px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 10px; }
  h1 { font-size: 16px; font-weight: 700; color: #f8fafc; }
  .sub { font-size: 10px; color: #94a3b8; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34d399; margin-right: 3px; animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .chip { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .chip .k { font-size: 9px; color: #94a3b8; margin-bottom: 2px; white-space: nowrap; }
  .chip .v { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .traders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; min-width: 0; }
  .card-h {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 10px; border-bottom: 1px solid #334155;
  }
  .card-h .name { font-size: 12px; font-weight: 700; color: #f1f5f9; white-space: nowrap; }
  .asset { display: block; font-size: 10px; color: #7dd3fc; font-weight: 600; margin-top: 1px; white-space: nowrap; }
  .asset.none { color: #475569; font-weight: 400; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #334155; color: #cbd5e1; }
  .badge.has { background: #1e3a5f; color: #7dd3fc; }
  .pos { padding: 6px 9px; border-bottom: 1px solid #263349; }
  .pos:last-child { border-bottom: none; }
  .pos-top { display: flex; align-items: baseline; gap: 4px; margin-bottom: 4px; flex-wrap: wrap; }
  .inst { font-size: 11px; font-weight: 700; color: #e2e8f0; }
  .side-long { font-size: 10px; font-weight: 700; color: #34d399; }
  .side-short { font-size: 10px; font-weight: 700; color: #f87171; }
  .lever { font-size: 9px; color: #fbbf24; font-weight: 600; }
  .mode { font-size: 9px; color: #64748b; }
  .time { font-size: 9px; color: #64748b; margin-left: auto; }
  .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .cell { min-width: 0; }
  .cell i { display: block; font-style: normal; font-size: 8px; color: #64748b; margin-bottom: 1px; white-space: nowrap; }
  .cell b { display: block; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .upl-row { margin-top: 4px; font-size: 10px; font-weight: 700; }
  .history { margin-top: 14px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
  .history-h { padding: 8px 12px; border-bottom: 1px solid #334155; font-size: 12px; font-weight: 700; color: #f1f5f9; }
  .log { padding: 7px 12px; border-bottom: 1px solid #263349; display: flex; gap: 8px; align-items: baseline; }
  .log:last-child { border-bottom: none; }
  .log .ts { font-size: 9px; color: #64748b; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .log .kind { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .kind-open { background: #064e3b; color: #34d399; }
  .kind-close { background: #7f1d1d; color: #f87171; }
  .kind-adj { background: #78350f; color: #fbbf24; }
  .log .txt { font-size: 10px; color: #cbd5e1; line-height: 1.5; min-width: 0; word-break: break-all; }
  .history-empty { padding: 16px 12px; text-align: center; color: #64748b; font-size: 11px; }
  .up { color: #34d399; }
  .down { color: #f87171; }
  .empty { padding: 18px 12px; text-align: center; color: #64748b; font-size: 12px; }
  footer { margin-top: 12px; text-align: center; font-size: 10px; color: #475569; line-height: 1.7; }
  .err {
    background: #7f1d1d; border: 1px solid #b91c1c; color: #fecaca;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 12px; display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 欧易博主实盘监控</h1>
    <span class="sub"><span class="dot"></span>仓位变动后 1~2 分钟同步</span>
    <span class="sub" id="refreshInfo">数据时间：--</span>
  </header>

  <div class="err" id="err"></div>

  <div class="chips">
    <div class="chip"><div class="k">监控博主</div><div class="v" id="c-traders">--</div></div>
    <div class="chip"><div class="k">当前总持仓</div><div class="v" id="c-pos">--</div></div>
    <div class="chip"><div class="k">总浮动盈亏</div><div class="v" id="c-upl">--</div></div>
    <div class="chip"><div class="k" id="c-asset-k">公开账户资产</div><div class="v" id="c-asset">--</div></div>
  </div>

  <div class="traders" id="traders"></div>

  <div class="history">
    <div class="history-h">📜 操作动作记录（与手机/微信推送同步）</div>
    <div id="alerts"><div class="history-empty">加载中...</div></div>
  </div>

  <footer>
    数据来源：欧易公开实盘接口 · 每 15 秒自动刷新<br>
    浮盈 <span class="up">绿色</span> / 浮亏 <span class="down">红色</span> · 开多 <span class="side-long">做多</span> / 开空 <span class="side-short">做空</span>
  </footer>
</div>

<script>
var REFRESH_SEC = 15;
var countdown = REFRESH_SEC;
// 数据源依次降级：Pages 同源（国内最稳）→ raw → GitHub API
var SOURCES = [
  "state.json",
  "https://raw.githubusercontent.com/yusheng1918/okx-monitor/main/state.json",
  "https://api.github.com/repos/yusheng1918/okx-monitor/contents/state.json"
];
var sourceIdx = 0;
var ALERT_SOURCES = [
  "alerts.jsonl",
  "https://raw.githubusercontent.com/yusheng1918/okx-monitor/main/alerts.jsonl",
  "https://api.github.com/repos/yusheng1918/okx-monitor/contents/alerts.jsonl"
];

function decodeApiContent(json) {
  var b64 = json.content.replace(/\s/g, "");
  var bytes = atob(b64);
  var utf8 = decodeURIComponent(bytes.split("").map(function (c) {
    return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(""));
  return JSON.parse(utf8);
}

function tryLoad(i, cb) {
  var url = SOURCES[i] + "?t=" + Date.now();
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (txt) {
    var data;
    if (txt.charAt(0) === "{") { data = JSON.parse(txt); }
    else { data = decodeApiContent(JSON.parse(txt)); }
    cb(null, data);
  }).catch(function (e) {
    cb(e);
  });
}

function fmt(n, d) {
  if (n === null || n === undefined || isNaN(n)) return "--";
  var num = Number(n);
  var abs = Math.abs(num);
  var digits = d !== undefined ? d : (abs >= 1000 ? 1 : (abs >= 1 ? 3 : 5));
  return num.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function fmtTs(ms) {
  if (!ms) return "--";
  var d = new Date(Number(ms));
  if (isNaN(d.getTime())) return "--";
  function p(x) { return (x < 10 ? "0" : "") + x; }
  return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function sideOf(p) {
  var s = (p.posSide || "").toLowerCase();
  if (s === "long") return { txt: "做多", cls: "side-long" };
  if (s === "short") return { txt: "做空", cls: "side-short" };
  var pos = Number(p.pos || 0);
  return pos >= 0 ? { txt: "做多", cls: "side-long" } : { txt: "做空", cls: "side-short" };
}
function coinQty(p) {
  // 优先用云端按官方合约面值算好的精确币数量，回退到反推，最后回退张数
  if (p.coinQty) {
    return fmt(p.coinQty, 4) + " 个" + (p.posCcy || "");
  }
  try {
    var pos = parseFloat(p.pos), last = parseFloat(p.last), notional = parseFloat(p.notionalUsd);
    if (pos > 0 && last > 0 && notional > 0) {
      var ctval = notional / (pos * last);
      return fmt(pos * ctval, 3) + " 个" + (p.posCcy || "");
    }
  } catch (e) {}
  return fmt(p.pos, 0) + " 张";
}
function clsUpl(v) { return Number(v) >= 0 ? "up" : "down"; }
function cell(label, value) {
  return '<div class="cell"><i>' + label + "</i><b>" + value + "</b></div>";
}

function render(state) {
  document.getElementById("err").style.display = "none";
  var traders = state.traders || {};
  var ids = Object.keys(traders);
  var totalPos = 0, totalUpl = 0;
  var html = "";

  ids.forEach(function (aid) {
    var t = traders[aid] || {};
    var name = t.nickname || ("博主 " + aid.slice(-6));
    var positions = t.positions || [];
    totalPos += positions.length;

    var rows = "";
    positions.forEach(function (p) {
      var s = sideOf(p);
      var upl = parseFloat(p.upl);
      if (!isNaN(upl)) totalUpl += upl;
      rows += '<div class="pos">' +
        '<div class="pos-top">' +
          '<span class="inst">' + (p.instId || "--").replace("-SWAP", "") + "</span>" +
          '<span class="' + s.cls + '">' + s.txt + "</span>" +
          '<span class="lever">' + (p.lever || "?") + "x</span>" +
          '<span class="mode">' + (p.mgnMode === "cross" ? "全仓" : "逐仓") + "</span>" +
          '<span class="mode">' + coinQty(p) + "</span>" +
          '<span class="time">' + fmtTs(p.cTime) + "</span>" +
        "</div>" +
        '<div class="pos-grid">' +
          cell("开仓均价", fmt(p.avgPx)) +
          cell("现价", fmt(p.last)) +
          cell("数量", coinQty(p)) +
        "</div>" +
        '<div class="upl-row ' + clsUpl(upl) + '">浮动盈亏 ' +
          (isNaN(upl) ? "--" : (upl >= 0 ? "+" : "") + fmt(upl, 2) + " USDT") + "</div>" +
        "</div>";
    });

    var asset = parseFloat(t.asset);
    var assetHtml = isNaN(asset)
      ? '<span class="asset none">资产未公开</span>'
      : '<span class="asset">💰 ' + fmt(asset, 2) + " USDT</span>";

    html += '<div class="card">' +
      '<div class="card-h"><div><span class="name">' + name + "</span>" + assetHtml + "</div>" +
      '<span class="badge' + (positions.length ? " has" : "") + '">' + (positions.length ? positions.length + " 仓" : "空仓") + "</span></div>";
    if (positions.length) {
      html += rows;
    } else {
      html += '<div class="empty">当前空仓</div>';
    }
    html += "</div>";
  });

  document.getElementById("traders").innerHTML = html;
  document.getElementById("c-traders").textContent = ids.length;
  document.getElementById("c-pos").textContent = totalPos;
  var uplEl = document.getElementById("c-upl");
  uplEl.textContent = (totalUpl >= 0 ? "+$" : "-$") + fmt(Math.abs(totalUpl), 2);
  uplEl.className = "v " + clsUpl(totalUpl);
  // 公开资产：显示第一位有资产数据的博主
  var assetName = "", assetVal = null;
  ids.forEach(function (aid) {
    var t = traders[aid] || {};
    var a = parseFloat(t.asset);
    if (assetVal === null && !isNaN(a)) { assetName = t.nickname || ""; assetVal = a; }
  });
  if (assetVal !== null) {
    document.getElementById("c-asset-k").textContent = assetName + "·资产";
    document.getElementById("c-asset").textContent = fmt(assetVal, 2);
  } else {
    document.getElementById("c-asset-k").textContent = "公开账户资产";
    document.getElementById("c-asset").textContent = "未公开";
  }
  document.getElementById("refreshInfo").textContent = "数据时间：" + (state.updated || "--");
}

function renderAlerts(lines) {
  var box = document.getElementById("alerts");
  if (!lines || !lines.length) {
    box.innerHTML = '<div class="history-empty">暂无操作记录</div>';
    return;
  }
  var KIND = { "开仓": "kind-open", "平仓": "kind-close", "调仓": "kind-adj" };
  var html = "";
  lines.slice(-100).reverse().forEach(function (r) {
    var kind = r.type || "调仓";
    var cls = KIND[kind] || "kind-adj";
    var ts = (r.ts || "").replace(/^2026-/, "");
    html += '<div class="log">' +
      '<span class="ts">' + ts + "</span>" +
      '<span class="kind ' + cls + '">' + kind + "</span>" +
      '<span class="txt">' + r.text + "</span>" +
      "</div>";
  });
  box.innerHTML = html;
}

function loadAlerts(cb) {
  tryLoadList(ALERT_SOURCES, 0, function (err, lines) {
    if (err) {
      document.getElementById("alerts").innerHTML = '<div class="history-empty">记录加载失败，下轮刷新重试</div>';
    } else {
      renderAlerts(lines);
    }
    if (cb) cb();
  });
}

function decodeB64(b64) {
  var bytes = atob(b64.replace(/\s/g, ""));
  return decodeURIComponent(bytes.split("").map(function (c) {
    return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(""));
}

function tryLoadList(sources, i, cb) {
  var url = sources[i] + "?t=" + Date.now();
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (txt) {
    var lines;
    if (txt.charAt(0) === "{") {
      var obj = JSON.parse(txt);
      if (obj && obj.content) { txt = decodeB64(obj.content); obj = null; }
      if (obj) { lines = Array.isArray(obj) ? obj : [obj]; }
    }
    if (!lines) {
      lines = txt.split("\n").filter(function (l) { return l.trim(); }).map(function (l) { return JSON.parse(l); });
    }
    cb(null, lines);
  }).catch(function (e) {
    if (i < sources.length - 1) return tryLoadList(sources, i + 1, cb);
    cb(e);
  });
}

function showErr(e) {
  var el = document.getElementById("err");
  el.style.display = "block";
  el.textContent = "⚠ 数据加载失败（" + e.message + "），将在下次刷新重试。若持续失败请检查网络。";
}

function load() {
  tryLoad(sourceIdx, function (err, data) {
    if (err && sourceIdx < SOURCES.length - 1) {
      sourceIdx++;
      tryLoad(sourceIdx, function (err2, data2) {
        if (err2) return showErr(err2);
        render(data2);
      });
      return;
    }
    if (err) return showErr(err);
    render(data);
  });
}

setInterval(function () {
  countdown--;
  if (countdown <= 0) { countdown = REFRESH_SEC; load(); loadAlerts(); }
}, 1000);

load();
loadAlerts();
</script>
</body>
</html>
