name: Probe OKX API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe endpoints
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          AID = "872873784163041281"  # 天才铁头娃
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}

          def hit(path):
              url = "https://www.okx.com" + path
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode("utf-8", "replace")
                  return r.status, body
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return "ERR", str(e)[:200]

          probes = [
              "/api/v5/orbit/public/position-current?authorId=" + AID,
              "/api/v5/orbit/public/position-history?authorId=" + AID + "&limit=50",
              "/api/v5/orbit/public/position-history?authorId=" + AID + "&pageSize=50",
              "/api/v5/orbit/public/position-history-detail?authorId=" + AID + "&limit=50",
              "/api/v5/orbit/public/orders-history?authorId=" + AID + "&limit=50",
              "/api/v5/orbit/public/order-history?authorId=" + AID + "&limit=50",
              "/api/v5/orbit/public/close-position-history?authorId=" + AID,
              "/api/v5/orbit/public/account-bills?authorId=" + AID,
          ]
          for p in probes:
              code, body = hit(p)
              print("=== " + p[:110])
              print("STATUS", code)
              print(body[:500].replace("\n", " "))
              print()

          # SNDK 行情（4H 覆盖 10-24 22:18 前后）
          for p in ["/api/v5/market/candles?instId=SNDK-USDT-SWAP&bar=4H&limit=60",
                    "/api/v5/market/candles?instId=SNDK-USDT-SWAP&bar=1D&limit=30"]:
              code, body = hit(p)
              print("=== " + p)
              print("STATUS", code, "LEN", len(body))
              try:
                  d = json.loads(body)
                  rows = d.get("data") or []
                  print("K线数量", len(rows))
                  for r in rows[:3]:
                      print("  ", r[:6])
              except Exception as e:
                  print("解析失败", e, body[:200])
              print()
          PY
