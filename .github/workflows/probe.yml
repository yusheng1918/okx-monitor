name: Probe OKX API 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch SNDK candles + trader stats
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import json, datetime
          import okx_monitor_cloud as m

          def fmt(ts):
              return datetime.datetime.fromtimestamp(int(ts)/1000 + 8*3600).strftime("%m-%d %H:%M")

          for bar, lim in [("1D", 40), ("4H", 60), ("1H", 72)]:
              print("##### SNDK", bar)
              try:
                  d = m.okx_get(f"/api/v5/market/candles?instId=SNDK-USDT-SWAP&bar={bar}&limit={lim}")
                  rows = d.get("data") or []
                  for r in reversed(rows):
                      # r = [ts, o, h, l, c, vol, volCcy, volCcyQuote, confirm]
                      print(fmt(r[0]), "O", r[1], "H", r[2], "L", r[3], "C", r[4])
              except Exception as e:
                  print("ERR", e)
              print()

          print("##### 账户榜数据")
          try:
              lb = m.get_leaderboard_assets([t["authorId"] for t in m.TRADERS])
              for k, v in lb.items():
                  print(k, json.dumps(v, ensure_ascii=False))
          except Exception as e:
              print("ERR", e)

          print("##### 历史接口（带签名尝试）")
          AID = "872873784163041281"
          for p in [f"/api/v5/orbit/public/position-history?authorId={AID}",
                    f"/api/v5/orbit/public/position-history?authorId={AID}&limit=30",
                    f"/api/v5/orbit/public/trade-history?authorId={AID}"]:
              try:
                  d = m.okx_get(p)
                  print(p[:80], "->", json.dumps(d, ensure_ascii=False)[:400])
              except Exception as e:
                  print(p[:80], "-> ERR", str(e)[:150])
          PY
