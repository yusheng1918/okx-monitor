name: Probe OKX API 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe3:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dump position history
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import json, datetime
          import okx_monitor_cloud as m

          AID = "872873784163041281"  # 天才铁头娃

          def t(ms):
              return datetime.datetime.fromtimestamp(int(ms)/1000 + 8*3600).strftime("%m-%d %H:%M")

          d = m.okx_get(f"/api/v5/orbit/public/position-history?authorId={AID}&limit=100")
          rows = d.get("data") or []
          print("HISTORY_COUNT", len(rows))
          for r in rows:
              print("HIST|", t(r.get("uTime") or r.get("cTime")), "|", r.get("instId"),
                    "|", r.get("posSide"), "| lev", r.get("lever"),
                    "| open", r.get("openAvgPx"), "| close", r.get("closeAvgPx"),
                    "| amt", r.get("closeAmount"), "| pnl", r.get("pnl"),
                    "| ratio", r.get("pnlRatio"), "| type", r.get("closeType"),
                    "| cTime", t(r.get("cTime")) if r.get("cTime") else "-",
                    "| uTime", t(r.get("uTime")) if r.get("uTime") else "-")

          # 当前持仓
          cur = m.get_positions(AID)
          print("CURRENT_COUNT", len(cur))
          for p in cur:
              print("CUR|", p.get("instId"), p.get("posSide"), "lev", p.get("lever"),
                    "avg", p.get("avgPx"), "pos", p.get("pos"),
                    "open", t(p["cTime"]) if p.get("cTime") else "-",
                    "upl", p.get("upl"), "last", p.get("last"))
          PY
