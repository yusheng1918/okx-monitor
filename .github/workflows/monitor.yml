name: OKX Trader Monitor

on:
  schedule:
    - cron: "*/3 * * * *"   # 兜底：GitHub 自带定时（最低实际间隔约5分钟），主节奏由 cron-job.org 每分钟触发
  workflow_dispatch:         # 允许外部定时器/手动触发（1分钟一轮的实际驱动）

concurrency:
  group: okx-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 时效性最强的一步放最前：从触发到 ETH 信号判定只等 checkout + 本步（约 8 秒）
      - name: Run Tietou ETH plan
        if: false          # WORK（饼哥）已并入 mm，停止独立运行
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_KEY_2: ${{ secrets.BARK_KEY_2 }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python tietou_eth.py

      - name: Run monitor
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_KEY_2: ${{ secrets.BARK_KEY_2 }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python okx_monitor_cloud.py
          sleep 20
          python okx_monitor_cloud.py

      # 注：ZEC / ETH 波段（zec_swing.py、eth_swing.py）已于 2026-10-28 按用户要求停用并移出流水线
      - name: Commit state back
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@github.com"
          git add state.json alerts.jsonl tietou_eth_state.json 2>/dev/null || git add state.json
          git diff --cached --quiet || git commit -m "chore: update position state [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "push 成功"; break; fi
            echo "push 冲突，拉取后重试 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
