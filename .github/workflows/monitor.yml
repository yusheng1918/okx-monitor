name: OKX Trader Monitor

on:
  schedule:
    - cron: "*/3 * * * *"   # 兜底：GitHub 自带定时（最低实际间隔约5分钟），主节奏由 cron-job.org 每分钟触发
  workflow_dispatch:         # 允许外部定时器/手动触发（1分钟一轮的实际驱动）

concurrency:
  group: okx-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python okx_monitor_cloud.py

      - name: Run ZEC swing plan
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python zec_swing.py

      - name: Run ETH swing plan
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python eth_swing.py

      - name: Run Tietou ETH plan
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python tietou_eth.py

      - name: Commit state back
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@github.com"
          git add state.json alerts.jsonl zec_swing_state.json eth_swing_state.json tietou_eth_state.json 2>/dev/null || git add state.json
          git diff --cached --quiet || git commit -m "chore: update position state [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "push 成功"; break; fi
            echo "push 冲突，拉取后重试 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
