name: OKX Trader Monitor

on:
  schedule:
    - cron: "*/3 * * * *"   # 每 3 分钟一次（公开仓库 Actions 免费不限量）
  workflow_dispatch:         # 允许手动触发

concurrency:
  group: okx-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python okx_monitor_cloud.py

      - name: Run ZEC strategy
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python zec_strategy.py

      - name: Commit state back
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@github.com"
          git add state.json alerts.jsonl zec_state.json 2>/dev/null || git add state.json alerts.jsonl 2>/dev/null || git add state.json
          git diff --cached --quiet || git commit -m "chore: update position state [skip ci]"
          git push
