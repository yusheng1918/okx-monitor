name: MM Levels

# 多周期做市商价位监测（BTC/ETH/ZEC）
# 与仓库里已有的 "OKX Trader Monitor" 互不干扰：本工作流只写 mm-dashboard.html
on:
  workflow_dispatch:
    inputs:
      test:
        description: "只发一条测试推送到 Bark（验证通道与 DEEP-- 前缀）"
        type: boolean
        default: false
  schedule:
    - cron: "0 * * * *"      # 兜底：每小时一次。主触发由 cron-job.org 每分钟调用 workflow_dispatch

concurrency:
  group: mm-levels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数据源连通性自检
        run: python mm/source_check.py

      - name: 恢复状态（冷却、已入场标记）
        uses: actions/cache/restore@v4
        with:
          path: mm/monitor_data
          key: mmstate-${{ github.run_id }}
          restore-keys: |
            mmstate-

      - name: 测试推送（可选）
        if: ${{ inputs.test }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python mm/mm_monitor.py --test

      - name: 分析并推送
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          DASHBOARD_URL: ${{ vars.MM_DASHBOARD_URL }}
          DASHBOARD_PATH: ${{ github.workspace }}/mm-dashboard.html
        run: python mm/mm_monitor.py --once

      - name: 发布看板
        run: |
          if [ ! -f mm/monitor_data/publish.ok ]; then
            echo "未到 10 分钟发布间隔，跳过提交"
            exit 0
          fi
          rm -f mm/monitor_data/publish.ok
          git config user.name "mm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain mm-dashboard.html)" ]; then
            echo "看板无变化，跳过提交"
            exit 0
          fi
          git add mm-dashboard.html
          git commit -m "mm-dashboard: $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "推送冲突，重试 $i"; sleep 5
          done

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mm/monitor_data
          key: mmstate-${{ github.run_id }}
